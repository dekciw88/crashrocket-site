<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Crash Rocket</title>
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #090B24;
        overflow: hidden;
      }
      #unity-container {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #unity-canvas {
        display: block;
        background: #090B24;
      }
    </style>
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" width=540 height=1170 tabindex="-1"></canvas>
    </div>
    <script>
      // Рамка-телефон 1080×2340 (9:19.5, см. UIBuilder.DesignWidth/DesignHeight) вписывается
      // в окно браузера целиком, без прокрутки (TASKS/011, шаг 1): по высоте на широком
      // экране (по бокам остаётся фон-космос), а на мобильном окно и так уже кадра — та же
      // формула сама даёт canvas на всю ширину. "Contain": берём меньший из двух масштабов.
      var canvas = document.querySelector("#unity-canvas");
      var PHONE_ASPECT = 1080 / 2340;

      function resizeCanvas() {
        var vw = window.innerWidth;
        var vh = window.innerHeight;
        var w = vw;
        var h = w / PHONE_ASPECT;
        if (h > vh) {
          h = vh;
          w = h * PHONE_ASPECT;
        }
        canvas.style.width = w + "px";
        canvas.style.height = h + "px";
      }
      window.addEventListener("resize", resizeCanvas);
      resizeCanvas();

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/webgl.loader.js";
      var config = {
        dataUrl: buildUrl + "/webgl.data",
        frameworkUrl: buildUrl + "/webgl.framework.js",
        codeUrl: buildUrl + "/webgl.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "Crash Games",
        productName: "Crash Rocket",
        productVersion: "0.1.0",
        matchWebGLToCanvasSize: true,
      };

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {}).then(function (unityInstance) {
          window.unityInstance = unityInstance;
        }).catch(function (message) {
          alert(message);
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
